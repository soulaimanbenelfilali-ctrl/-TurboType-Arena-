<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سباق الكتابة السريعة - TurboType Arena Online</title>
  
  <!-- مكتبات Firebase للعب الجماعي المباشر (أونلاين) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap');

    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151c2c;
      --accent-blue: #00d2ff;
      --accent-red: #ff3b5c;
      --accent-gold: #ffb800;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    select, button {
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2d3b55;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0072ff, #00d2ff);
      border: none;
      color: #000;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff3b5c, #ff7b00);
      border: none;
      color: #fff;
    }

    /* لوحة اختيار الوضع والأونلاين */
    .lobby-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mode-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .online-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 210, 255, 0.06);
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed rgba(0, 210, 255, 0.3);
    }

    .room-code-display {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent-gold);
      letter-spacing: 2px;
      background: #0b0f19;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent-gold);
    }

    .join-group {
      display: flex;
      gap: 6px;
    }

    .join-group input {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      width: 130px;
      text-align: center;
      font-weight: 800;
      letter-spacing: 2px;
    }

    /* مضمار السباق */
    .track-area {
      background: #0f172a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      border: 2px solid #1e293b;
      position: relative;
      overflow: hidden;
    }

    .lane {
      position: relative;
      height: 54px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .lane:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .lane-label {
      position: absolute;
      top: 2px;
      right: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      z-index: 1;
    }

    .finish-line {
      position: absolute;
      left: 14px;
      top: 0;
      bottom: 0;
      width: 8px;
      background: repeating-linear-gradient(
        0deg,
        #fff,
        #fff 6px,
        #000 6px,
        #000 12px
      );
      opacity: 0.7;
    }

    .car {
      position: absolute;
      right: 10px;
      font-size: 2rem;
      transition: right 0.25s ease-out;
      z-index: 2;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      display: flex;
      align-items: center;
    }

    .turbo-flame {
      display: none;
      font-size: 1.2rem;
      margin-right: -6px;
      animation: flicker 0.15s infinite alternate;
    }

    .car.turbo .turbo-flame {
      display: inline-block;
    }

    @keyframes flicker {
      from { transform: scale(0.9); opacity: 0.8; }
      to { transform: scale(1.25); opacity: 1; }
    }

    /* منطقة النص والكتابة */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .stat-item span {
      color: var(--accent-blue);
      font-size: 1.1rem;
    }

    .text-display {
      background: #0b0f19;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.25rem;
      line-height: 1.9;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
      min-height: 95px;
    }

    .char-correct {
      color: #22c55e;
    }

    .char-incorrect {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border-radius: 3px;
    }

    .char-current {
      border-bottom: 3px solid var(--accent-gold);
      color: #fff;
    }

    .typing-input {
      width: 100%;
      padding: 14px;
      font-size: 1.15rem;
      border-radius: 12px;
      border: 2px solid var(--accent-blue);
      background: #0f172a;
      color: #fff;
      outline: none;
      text-align: center;
      font-weight: 700;
    }

    .typing-input:disabled {
      opacity: 0.5;
      border-color: #334155;
    }

    .status-banner {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: 800;
      background: rgba(255, 184, 0, 0.12);
      color: var(--accent-gold);
    }

    @media (max-width: 600px) {
      .title { font-size: 1.15rem; }
      .text-display { font-size: 1.05rem; padding: 12px; }
      .car { font-size: 1.65rem; }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">🏎️ سباق الكتابة السريعة (TurboType)</div>
    <div class="controls-top">
      <select id="langSelect" onchange="changeLanguage()">
        <option value="ar">العربية 🇲🇦</option>
        <option value="en">English 🇺🇸</option>
      </select>
      <button class="btn-primary" onclick="startSoloRace()">سباق فردي (AI)</button>
    </div>
  </div>

  <!-- لوحة الأونلاين وإنشاء الغرفة -->
  <div class="lobby-box">
    <div class="online-panel">
      <div>
        <button class="btn-danger" onclick="createOnlineRoom()">🌐 إنشاء غرفة أونلاين</button>
        <span id="roomBox" style="display:none; margin-right: 8px;">
          رمز الغرفة: <span class="room-code-display" id="roomCodeText">------</span>
          <button onclick="copyRoomCode()" title="نسخ الرمز">📋</button>
        </span>
      </div>

      <div class="join-group">
        <input type="text" id="joinCodeInput" maxlength="6" placeholder="رمز الغرفة" />
        <button class="btn-primary" onclick="joinOnlineRoom()">دخول</button>
      </div>
    </div>
  </div>

  <div class="status-banner" id="statusBanner">
    اختر "سباق فردي" للتدريب، أو أنشئ غرفة أونلاين وتحدى صديقك!
  </div>

  <!-- مضمار السباق -->
  <div class="track-area" id="trackArea">
    <div class="finish-line"></div>
    <div class="lane">
      <div class="lane-label">أنت (اللاعب 1)</div>
      <div class="car" id="player1Car">🏎️<span class="turbo-flame">🔥</span></div>
    </div>
    <div class="lane">
      <div class="lane-label" id="opponentLabel">المنافس (اللاعب 2 / AI)</div>
      <div class="car" id="player2Car">🚓<span class="turbo-flame">🔥</span></div>
    </div>
  </div>

  <!-- الإحصائيات -->
  <div class="stats-bar">
    <div class="stat-item">السرعة: <span id="wpmDisplay">0</span> كلمة/د</div>
    <div class="stat-item">الدقة: <span id="accDisplay">100</span>%</div>
    <div class="stat-item">التقدم: <span id="progDisplay">0</span>%</div>
  </div>

  <!-- النص المطلوب كتابته -->
  <div class="text-display" id="textDisplay"></div>

  <!-- حقل الكتابة (يدعم الحاسوب والهاتف) -->
  <input
    type="text"
    id="typingInput"
    class="typing-input"
    placeholder="اضغط هنا وابدأ الكتابة بسرعة..."
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    disabled
  />
</div>

<script>
  // ==========================================
  // 1. إعدادات قاعدة بيانات Firebase (مهم جداً)
  // ضع رابط Realtime Database الخاص بك مكان الرابط أسفله
  // ==========================================
  const firebaseConfig = {
    databaseURL: "https://turbotype-arena-default-rtdb.firebaseio.com/"
  };

  let db = null;
  try {
    if (!firebaseConfig.databaseURL.includes("turbotype-arena
")) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  } catch (e) {
    console.warn("Firebase not configured yet:", e);
  }

  // نصوص السباق
  const texts = {
    ar: [
      "السرعة في الكتابة على لوحة المفاتيح مهارة رائعة تفتح لك آفاقا واسعة في العمل والدراسة وتجعلك تنجز مهامك في وقت قياسي.",
      "كل حرف تكتبه بدقة يزيد من قوة محرك سيارتك على المضمار، حافظ على تركيزك ولا تدع الأخطاء تبطئ انطلاقتك نحو خط النهاية.",
      "التدريب المستمر هو سر الاحتراف في كل مجال، ابدأ ببطء وركز على الدقة أولا وستجد أن سرعتك ترتفع تلقائيا يوما بعد يوم."
    ],
    en: [
      "Typing fast and accurately is a superpower in the digital age. Keep your eyes on the screen and let your fingers fly across the keys.",
      "Every correct word fuels your turbo engine on the race track. Stay focused, avoid mistakes, and cross the finish line first.",
      "Practice makes perfect. Focus on accuracy first, and your speed will naturally increase with every race you complete."
    ]
  };

  let currentLang = 'ar';
  let targetText = '';
  let startTime = null;
  let gameActive = false;
  let isOnline = false;
  let currentRoomId = null;
  let playerRole = null; // 'p1' or 'p2'
  let aiInterval = null;
  let aiProgress = 0;

  const textDisplay = document.getElementById('textDisplay');
  const typingInput = document.getElementById('typingInput');
  const statusBanner = document.getElementById('statusBanner');

  function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    typingInput.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    if (!isOnline) startSoloRace();
  }

  function renderText(typed) {
    let html = '';
    for (let i = 0; i < targetText.length; i++) {
      if (i < typed.length) {
        if (typed[i] === targetText[i]) {
          html += `<span class="char-correct">${targetText[i]}</span>`;
        } else {
          html += `<span class="char-incorrect">${targetText[i]}</span>`;
        }
      } else if (i === typed.length) {
        html += `<span class="char-current">${targetText[i]}</span>`;
      } else {
        html += `<span>${targetText[i]}</span>`;
      }
    }
    textDisplay.innerHTML = html;
  }

  function updateCarPosition(carId, percent, wpm = 0) {
    const car = document.getElementById(carId);
    const trackWidth = document.getElementById('trackArea').clientWidth - 75;
    const pos = Math.min(100, Math.max(0, percent));
    const pixels = (pos / 100) * trackWidth;

    if (currentLang === 'ar') {
      car.style.right = (10 + pixels) + 'px';
      car.style.left = 'auto';
    } else {
      car.style.left = (10 + pixels) + 'px';
      car.style.right = 'auto';
    }

    if (wpm >= 35) {
      car.classList.add('turbo');
    } else {
      car.classList.remove('turbo');
    }
  }

  function resetTrack() {
    clearInterval(aiInterval);
    aiProgress = 0;
    updateCarPosition('player1Car', 0, 0);
    updateCarPosition('player2Car', 0, 0);
    document.getElementById('wpmDisplay').textContent = '0';
    document.getElementById('accDisplay').textContent = '100';
    document.getElementById('progDisplay').textContent = '0';
    typingInput.value = '';
  }

  // ==========================
  // الوضع الفردي ضد الذكاء الاصطناعي
  // ==========================
  function startSoloRace() {
    isOnline = false;
    currentRoomId = null;
    document.getElementById('roomBox').style.display = 'none';
    document.getElementById('opponentLabel').textContent = 'الذكاء الاصطناعي (AI)';
    resetTrack();

    const pool = texts[currentLang];
    targetText = pool[Math.floor(Math.random() * pool.length)];
    renderText('');

    gameActive = true;
    startTime = null;
    typingInput.disabled = false;
    typingInput.focus();
    statusBanner.textContent = '🏁 انطلق! ابدأ بكتابة النص بأقصى سرعة!';

    aiInterval = setInterval(() => {
      if (!gameActive || !startTime) return;
      aiProgress += 0.65; // سرعة AI متوسطة
      updateCarPosition('player2Car', aiProgress, 40);
      if (aiProgress >= 100) {
        endRace('للأسف! سبقك الذكاء الاصطناعي إلى خط النهاية 😅');
      }
    }, 200);
  }

  // ==========================
  // وضع الأونلاين (Firebase)
  // ==========================
  function checkFirebaseReady() {
    if (!db) {
      alert('https://turbotype-arena-default-rtdb.firebaseio.com/');
      return false;
    }
    return true;
  }

  function createOnlineRoom() {
    if (!checkFirebaseReady()) return;
    resetTrack();
    isOnline = true;
    playerRole = 'p1';
    currentRoomId = Math.floor(100000 + Math.random() * 900000).toString();

    const pool = texts[currentLang];
    targetText = pool[Math.floor(Math.random() * pool.length)];

    document.getElementById('roomBox').style.display = 'inline-block';
    document.getElementById('roomCodeText').textContent = currentRoomId;
    document.getElementById('opponentLabel').textContent = 'صديقك (اللاعب 2)';
    statusBanner.textContent = `⏳ في انتظار دخول صديقك برمز الغرفة: ${currentRoomId} ...`;
    typingInput.disabled = true;
    renderText('');

    const roomRef = db.ref('rooms/' + currentRoomId);
    roomRef.set({
      lang: currentLang,
      text: targetText,
      status: 'waiting',
      p1: { progress: 0, wpm: 0 },
      p2: { joined: false, progress: 0, wpm: 0 }
    });

    // مراقبة دخول اللاعب الثاني وتقدمه
    roomRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) return;

      if (data.p2 && data.p2.joined && data.status === 'waiting') {
        roomRef.update({ status: 'racing' });
      }

      if (data.status === 'racing' && !gameActive) {
        gameActive = true;
        startTime = Date.now();
        typingInput.disabled = false;
        typingInput.focus();
        statusBanner.textContent = '🔥 انضم صديقك! السباق بدأ الآن، اكتب بسرعة!';
      }

      if (data.p2) {
        updateCarPosition('player2Car', data.p2.progress || 0, data.p2.wpm || 0);
        if (data.p2.progress >= 100 && gameActive) {
          endRace('😢 فاز صديقك في هذا السباق! حاول مرة أخرى.');
        }
      }
    });
  }

  function joinOnlineRoom() {
    if (!checkFirebaseReady()) return;
    const code = document.getElementById('joinCodeInput').value.trim();
    if (code.length !== 6) {
      alert('المرجو إدخال رمز غرفة صحيح مكون من 6 أرقام.');
      return;
    }

    const roomRef = db.ref('rooms/' + code);
    roomRef.once('value', (snap) => {
      const data = snap.val();
      if (!data) {
        alert('الغرفة غير موجودة! تأكد من الرمز التسلسلي.');
        return;
      }

      resetTrack();
      isOnline = true;
      playerRole = 'p2';
      currentRoomId = code;
      currentLang = data.lang || 'ar';
      document.getElementById('langSelect').value = currentLang;
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      targetText = data.text;
      renderText('');

      document.getElementById('opponentLabel').textContent = 'صاحب الغرفة (اللاعب 1)';
      roomRef.child('p2').update({ joined: true, progress: 0, wpm: 0 });

      roomRef.on('value', (s) => {
        const d = s.val();
        if (!d) return;

        if (d.status === 'racing' && !gameActive) {
          gameActive = true;
          startTime = Date.now();
          typingInput.disabled = false;
          typingInput.focus();
          statusBanner.textContent = '🔥 تم الاتصال بنجاح! السباق بدأ الآن!';
        }

        if (d.p1) {
          updateCarPosition('player2Car', d.p1.progress || 0, d.p1.wpm || 0);
          if (d.p1.progress >= 100 && gameActive) {
            endRace('😢 فاز صاحب الغرفة في هذا السباق!');
          }
        }
      });
    });
  }

  function copyRoomCode() {
    navigator.clipboard.writeText(currentRoomId);
    alert('تم نسخ رمز الغرفة: ' + currentRoomId + ' - أرسله لصديقك الآن!');
  }

  function endRace(message) {
    gameActive = false;
    clearInterval(aiInterval);
    typingInput.disabled = true;
    statusBanner.textContent = message;
  }

  // ==========================
  // معالجة الكتابة (حاسوب + هاتف)
  // ==========================
  typingInput.addEventListener('input', () => {
    if (!gameActive) return;
    if (!startTime) startTime = Date.now();

    const typed = typingInput.value;
    renderText(typed);

    // حساب الدقة والتقدم
    let correctChars = 0;
    for (let i = 0; i < typed.length; i++) {
      if (typed[i] === targetText[i]) correctChars++;
    }

    const accuracy = typed.length > 0 ? Math.round((correctChars / typed.length) * 100) : 100;
    const progress = Math.min(100, Math.round((correctChars / targetText.length) * 100));

    // حساب السرعة WPM
    const elapsedMinutes = (Date.now() - startTime) / 60000;
    const wordsTyped = correctChars / 5;
    const wpm = elapsedMinutes > 0.01 ? Math.round(wordsTyped / elapsedMinutes) : 0;

    document.getElementById('wpmDisplay').textContent = wpm;
    document.getElementById('accDisplay').textContent = accuracy;
    document.getElementById('progDisplay').textContent = progress;

    updateCarPosition('player1Car', progress, wpm);

    // تحديث البيانات في Firebase إذا كان السباق أونلاين
    if (isOnline && db && currentRoomId) {
      db.ref(`rooms/${currentRoomId}/${playerRole}`).update({
        progress: progress,
        wpm: wpm
      });
    }

    // التحقق من الفوز
    if (typed === targetText) {
      endRace(`🏆 مبروك! فزت بالسباق بسرعة ${wpm} كلمة في الدقيقة!`);
    }
  });

  // تهيئة أولية
  startSoloRace();
</script>

</body>
</html>
